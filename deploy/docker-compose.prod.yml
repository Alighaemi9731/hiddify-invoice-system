# Production stack (Phase 2) — one domain, automatic HTTPS via Caddy.
#
#   Caddy (:80/:443, auto Let's Encrypt)
#     ├── /api/*  /health  /docs  → backend:8000
#     └── everything else          → frontend (static SPA)
#
# Usage (on the server, done for you by deploy/install.sh):
#   cp .env.example .env   # set SERVER_DOMAIN, ACME_EMAIL, SECRET_KEY, ADMIN_PASSWORD, DB creds
#   docker compose -f deploy/docker-compose.prod.yml up -d --build

# Bounded container logs on every service: Docker's default json-file driver has NO size
# cap, so a chatty/looping container slowly fills the VPS disk. 10 MiB × 3 files ≈ 30 MiB
# per service, rotated by the daemon.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Memory caps protect the host from ONE runaway container taking the whole box down with it —
# they are generous ceilings, not budgets. An OOM-killed container self-heals via
# `restart: unless-stopped`; a host-level OOM can kill dockerd or Postgres instead.
#
# Measured on the production host (2026-08-07): 3815 MiB RAM + 2 GiB swap, containers using
# ~1.1 GiB in total (caddy 12 · scheduler 326 · bot 369 · backend 206 · db 192 · frontend 4).
# The caps below sum to 3264 MiB, which stays under RAM on purpose — the sum must never exceed
# the host, or a simultaneous spike trades a self-healing container OOM for a host OOM that can
# take Postgres or dockerd with it. Re-check this arithmetic before raising any cap.

services:
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-invoice}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice} -d ${POSTGRES_DB:-invoice}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      # Wave 5: the scheduler runs in its OWN container (below) so a heavy job (sync
      # parse, monthly invoicing, backup) can never contend with API requests for the
      # event loop or the API's connection pool. The API deliberately stays at ONE
      # uvicorn worker: loginsec keeps captcha + rate-limit state in process-local
      # dicts, so a second worker would fail ~half of captcha validations and halve
      # brute-force lockouts (measured decision, 2026-07-22 program).
      RUN_SCHEDULER: "false"
      CADDY_ADMIN: "http://caddy:2019"
      UPDATE_DIR: /app/data/update
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      # Mount the repo-root .env so the in-panel "set domain" can persist SERVER_DOMAIN.
      - ../.env:/app/.env
      # Shared with the host-side update watcher: the panel's «به‌روزرسانی» button writes
      # a flag here that deploy/updater.sh (systemd) picks up to rebuild to the latest.
      # NOTE: relative paths resolve from the compose file's dir (deploy/), so this MUST be
      # ../update to land on the repo-root `update/` that install.sh + the systemd unit use
      # (UPDATE_DIR=$REPO_DIR/update). Using ./update here pointed at deploy/update — a
      # different directory — so the backend never saw the watcher (always "not installed").
      - ../update:/app/data/update
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  scheduler:
    build: ../backend
    restart: unless-stopped
    logging: *default-logging
    # 512m was NOT enough: the kernel OOM-killed this container every few hours (Jul 29–31, always
    # ~520 MB anon-rss right on the cap) and each kill cut whatever job was mid-run — a backup, a
    # delivery batch, an enforcement chunk. `docker inspect` hides it (`OOMKilled` reflects only the
    # last exit) and the container comes back «healthy», so it stayed invisible for days.
    mem_limit: 768m
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
      RUN_SCHEDULER: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    # Same image/app as the backend, but its only job is APScheduler (sync, invoicing,
    # dunning, enforcement queue, backups, rate refresh). The HTTP server exists solely
    # for the healthcheck below — port 8010, never published, unreachable from outside
    # (Caddy routes only to backend:8000). Exactly ONE replica: jobs already serialize
    # via per-subsystem Postgres advisory locks, but the schedule itself must not
    # double-fire.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  bot:
    build: ../backend
    restart: unless-stopped
    logging: *default-logging
    # One process polls the main bot AND every storefront bot (151 and growing), and it sat at
    # 366/512 MB — close enough to the cap that one busy broadcast would OOM the WHOLE fleet.
    # Raised again to 1024m: measured ~1.8 MB of resident state per bot (Bot + aiohttp session +
    # poll task), so 768m would run out around ~350 shops. This buys room to ~500 while keeping
    # the cap total under host RAM. Sharding the fleet across containers is the answer past that,
    # NOT a bigger cap — but it needs token-ownership enforcement first, or the 409 double-delivery
    # bug documented in app/bot/storefront/manager.py comes back.
    mem_limit: 1024m
    env_file: ../.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    command: python -m app.bot.run
    # The bot has no HTTP server; app/bot/run.py touches this container-local file every
    # 30s while its event loop is alive. Stale mtime (>120s) → unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/tmp/bot.heartbeat').st_mtime<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      args:
        # In production the SPA talks to the API on the SAME origin (Caddy proxies /api).
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    healthcheck:
      # busybox wget (nginx:alpine); a hung/crashed nginx flips the service unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine@sha256:77c07d5ebfa5be9fd6c820d2094ae662c9e7eeb9bf98346b7f639900263ee2a2
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      # Empty → Caddy serves plain HTTP on :80 (reachable at http://<server-ip>).
      # Set a real domain (here or via the panel) to switch on automatic HTTPS.
      SERVER_DOMAIN: ${SERVER_DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    # --resume: when a domain has been set in the panel, the live config (domain +
    # auto-HTTPS + the bare-IP → https://domain redirect) is autosaved to /config and
    # RESTORED on restart/rebuild. On a fresh install (no autosave) it falls back to
    # the Caddyfile (:80 on the server IP) until the setup wizard sets a domain.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --resume
    # Where Caddy is published on the HOST. Defaults grab the whole box's 80/443.
    # Behind a TLS-passthrough relay (nginx SNI) that already owns 80/443, set
    # CADDY_HTTP_PUBLISH=127.0.0.1:8080 and CADDY_HTTPS_PUBLISH=127.0.0.1:8443 in
    # .env (install.sh does this for you with BEHIND_RELAY=1) so Caddy binds only
    # localhost high ports and the relay forwards this panel's domain here. Caddy
    # still gets its own Let's Encrypt cert — TLS-ALPN-01 passes through SNI relaying.
    ports:
      - "${CADDY_HTTP_PUBLISH:-80}:80"
      - "${CADDY_HTTPS_PUBLISH:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Caddy is the single ingress; without a healthcheck a wedged Caddy (config-reload
    # deadlock / FD exhaustion) keeps reporting "running" while the site is down. Probe its
    # admin endpoint (localhost only, always up when Caddy is healthy).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  app_data:
  caddy_data:
  caddy_config:
