[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -q
markers =
    pg_contract: real-Postgres concurrency/contract test (row locks, advisory locks, partial-unique
        constraints). Auto-skips unless DATABASE_URL points at Postgres; the CI backend-postgres job
        runs `pytest -m pg_contract` against a migrated postgres:16. SQLite can't assert these.
    real_pay_options: opt OUT of the autouse fixture that makes all payment methods available, so the
        test exercises the real payment_methods.load_options against its own seeded settings.
