name: CI

on:
  # BRANCHES ONLY — deliberately not tags. A release tag always points at a commit that was already
  # gated by its own `main` run (docs/RELEASE_PROCESS.md: tag only a green commit), so an unfiltered
  # `push:` re-ran the identical 5-job matrix a few seconds after the branch push and the two runs
  # then competed for the same runner pool. That contention, not any code change, is what failed the
  # v1.109.0 and v1.102.0 tag runs: same commit, `main` green, tag red on a 5s frontend test timeout.
  push:
    branches: ["main"]
  pull_request:

# One run per ref: a newer push supersedes an in-flight one instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip check
      - run: ruff check app tests alembic
      - run: mypy app
      - run: pytest -q
      - name: Check Alembic migrations and model drift
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          db="$tmpdir/schema.db"
          DATABASE_URL="sqlite+aiosqlite:///$db" alembic upgrade head
          DATABASE_URL="sqlite+aiosqlite:///$db" alembic check

  backend-postgres:
    # Production runs PostgreSQL 16, but the main test job (and the drift check above) run on
    # SQLite — dialect differences (boolean server_default, PG-only GUCs, constraint behavior,
    # AND row/advisory locking) have bitten before. This job applies every migration to a REAL
    # postgres:16 and runs the env-gated Postgres smoke tests PLUS the `pg_contract` concurrency
    # tests (row locks, advisory locks, partial-unique constraints) that SQLite cannot assert.
    # Full-suite-on-Postgres is out of scope (the test files hardcode SQLite engines).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci-only-not-a-secret@localhost:5432/ci
      SECRET_KEY: ci-only-not-a-secret-key
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Apply all migrations to PostgreSQL 16 and check drift
        run: |
          alembic upgrade head
          alembic check
      - name: Postgres smoke tests
        run: pytest -q tests/test_postgres_smoke.py
      - name: Postgres concurrency contract tests
        run: pytest -q -m pg_contract

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Audit what we actually SHIP. The dev tree is build-time only (vite, postcss, workbox,
      # jake/brace-expansion): a path-traversal or DoS there is not reachable by any user of the
      # deployed SPA, and letting those advisories red the pipeline blocks unrelated production
      # fixes from being released — the failure mode this gate is meant to prevent, inverted.
      # Runtime dependencies are still gated at `high`.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test -- --run
      - run: npm run lint:design
      - run: npm run build

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          bash -n deploy/install.sh deploy/bootstrap.sh deploy/updater.sh get.sh \
            deploy/package-release.sh deploy/release-installer.sh deploy/rollback.sh \
            deploy/smoke.sh deploy/test-release-tools.sh deploy/healthwatch.sh
      - run: bash deploy/test-release-tools.sh
      - name: Build and verify release assets
        run: |
          RELEASE_REF=HEAD bash deploy/package-release.sh "v$(cat VERSION)" /tmp/release
          cd /tmp/release
          sha256sum -c "invoice-system-v$(cat "$GITHUB_WORKSPACE/VERSION").tar.gz.sha256"
          sha256sum -c release-installer.sh.sha256
      - name: Validate production Compose
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-not-a-secret\n' > .env
          docker compose --env-file .env -f deploy/docker-compose.prod.yml config >/dev/null
      - name: Validate isolated staging Compose
        run: |
          cp deploy/.env.staging.example .env.staging
          docker compose --env-file .env.staging -f deploy/docker-compose.staging.yml config >/dev/null

  # Boots the REAL staging stack (Postgres + backend with boot-time Alembic + SPA +
  # ingress) and smoke-checks it — the one failure class nothing else in CI exercised
  # (boot loops, migration ordering, broken imports, unhealthy containers).
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Boot staging stack
        run: |
          cp deploy/.env.staging.example .env.staging
          docker compose --env-file .env.staging -f deploy/docker-compose.staging.yml up -d --build
      - name: Wait for backend health (deterministic timeout)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18080/health" >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json; echo; break
            fi
            sleep 5
            [ "$i" = "60" ] && { echo "backend never became healthy"; exit 1; }
          done
          python3 - <<'PY'
          import json
          h = json.load(open("/tmp/health.json"))
          assert h["database"] == "ok", h
          PY
      - name: Version endpoint matches the repo VERSION
        run: |
          curl -fsS http://127.0.0.1:18080/api/info | tee /tmp/info.json
          python3 - <<'PY'
          import json
          info = json.load(open("/tmp/info.json"))
          repo = open("VERSION").read().strip()
          assert info["version"] == repo, (info, repo)
          PY
      - name: Migration head matches the pinned HEAD
        run: |
          PIN=$(sed -n 's/^HEAD = "\(.*\)"$/\1/p' backend/tests/test_migrations_contracts.py)
          DBV=$(docker compose --env-file .env.staging -f deploy/docker-compose.staging.yml             exec -T db psql -U invoice_staging -d invoice_staging -tAc "SELECT version_num FROM alembic_version")
          echo "pin=$PIN db=$DBV"
          [ -n "$PIN" ] && [ "$PIN" = "$DBV" ]
      - name: No unhealthy containers
        run: |
          bad=$(docker compose --env-file .env.staging -f deploy/docker-compose.staging.yml ps             --format '{{.Name}} {{.Status}}' | grep -vE '\(healthy\)|Up' || true)
          [ -z "$bad" ] || { echo "unhealthy: $bad"; exit 1; }
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.staging -f deploy/docker-compose.staging.yml logs --no-color > /tmp/compose-smoke.log 2>&1 || true
          tail -200 /tmp/compose-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: compose-smoke-logs
          path: /tmp/compose-smoke.log
      - name: Teardown
        if: always()
        run: docker compose --env-file .env.staging -f deploy/docker-compose.staging.yml down -v
