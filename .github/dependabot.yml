version: 2
# Dependency updates are GROUPED (one PR per ecosystem) and infrequent, to keep the repo close to a
# single `main` branch while still surfacing security updates. NOTE: /deploy has no Dockerfile (only
# compose + shell scripts), so there is intentionally no docker ecosystem for it — its image pins
# (Caddy/Postgres) are reviewed manually at release time.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      backend-python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      frontend-npm:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      backend-docker:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      frontend-docker:
        patterns: ["*"]
