version: 2
# SINGLE-BRANCH POLICY (owner decision, 2026-07-21): the repository always has exactly one branch —
# `main`. Dependabot must never open PRs/branches: every ecosystem below is pinned to
# open-pull-requests-limit: 0, which keeps the config (and GitHub's security alerts) active while
# producing zero branches. Dependency bumps are done deliberately, inside a normal release, guided
# by `gh api repos/{owner}/{repo}/dependabot/alerts` and the lockfile audit in CI. NOTE: /deploy has no Dockerfile (only
# compose + shell scripts), so there is intentionally no docker ecosystem for it — its image pins
# (Caddy/Postgres) are reviewed manually at release time.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      backend-python:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      frontend-npm:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      backend-docker:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      frontend-docker:
        patterns: ["*"]
