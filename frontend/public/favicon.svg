<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ab5ff"/>
      <stop offset="1" stop-color="#0064d2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Top gloss — Apple icon style -->
  <rect width="64" height="34" rx="14" fill="url(#gloss)"/>
  <!-- Invoice body -->
  <rect x="16" y="12" width="26" height="32" rx="3" fill="rgba(255,255,255,0.95)"/>
  <!-- Lines on invoice -->
  <rect x="20" y="18" width="14" height="2.5" rx="1.25" fill="#0071e3" opacity="0.7"/>
  <rect x="20" y="23" width="18" height="2" rx="1" fill="#0071e3" opacity="0.35"/>
  <rect x="20" y="27" width="16" height="2" rx="1" fill="#0071e3" opacity="0.35"/>
  <rect x="20" y="31" width="12" height="2" rx="1" fill="#0071e3" opacity="0.35"/>
  <!-- Checkmark badge — bottom right -->
  <circle cx="42" cy="42" r="10" fill="#0071e3"/>
  <circle cx="42" cy="42" r="10" fill="rgba(255,255,255,0.15)"/>
  <path d="M37 42 l3.5 3.5 l6.5-7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
