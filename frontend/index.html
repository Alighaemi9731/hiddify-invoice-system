<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Standalone (installed PWA) chrome: full-screen web-app + notch-aware status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>سامانه مدیریت و فاکتور نمایندگان</title>
    <!-- Branded favicon (Apple-blue invoice mark) — replaces the browser's default globe.
         The ?v= query busts the browser's sticky favicon cache when the icon changes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- First-paint browser/OS chrome color; JS keeps the non-media tag in step with the toggle. -->
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" />
    <!-- Self-hosted Vazirmatn (variable, weights 100-900, OFL) — same-origin so first paint
         never blocks on a third-party font CDN (Google Fonts is slow/unreachable from some
         networks). Preload + font-display:swap: text paints immediately in the fallback and
         swaps when the single 111 KB woff2 arrives; the service worker precaches it. -->
    <link
      rel="preload"
      href="/fonts/Vazirmatn-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("/fonts/Vazirmatn-var.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: Vazirmatn, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
